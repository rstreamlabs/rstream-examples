name: Video qualification

on:
  workflow_dispatch:
    inputs:
      path:
        description: WebRTC path under test
        required: true
        default: relay
        type: choice
        options:
          - relay
          - direct
      protection:
        description: Packet-repair profile
        required: true
        default: nack-rtx-flexfec
        type: choice
        options:
          - nack-rtx-flexfec
          - nack-rtx
      playout_delay_hint_seconds:
        description: Chromium receiver playout-delay hint
        required: true
        default: "0.2"
        type: string
      flexfec_media_packets:
        description: Media packets per FlexFEC protection group
        required: true
        default: "5"
        type: string
      flexfec_repair_packets:
        description: FlexFEC repair packets per protection group
        required: true
        default: "1"
        type: string
      mobility:
        description: Exercise producer-side network migration
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: video-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: ${{ inputs.path }} ${{ inputs.protection }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: webrtc-video/producer/go.mod
          cache-dependency-path: webrtc-video/producer/go.sum

      - name: Validate qualification inputs
        shell: bash
        env:
          RSTREAM_AUTHENTICATION_TOKEN: ${{ secrets.RSTREAM_QUALIFICATION_TOKEN }}
          RSTREAM_QUALIFICATION_CONFIG_B64: ${{ secrets.RSTREAM_QUALIFICATION_CONFIG_B64 }}
        run: |
          set -euo pipefail
          for name in \
            RSTREAM_AUTHENTICATION_TOKEN \
            RSTREAM_QUALIFICATION_CONFIG_B64; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required qualification setting: %s\n' "$name" >&2
              exit 1
            fi
          done
          docker info >/dev/null

      - name: Prepare the credential-isolated runtime
        id: runtime
        working-directory: webrtc-video/producer/qualification/adaptive-streaming
        shell: bash
        env:
          INPUT_FLEXFEC_MEDIA_PACKETS: ${{ inputs.flexfec_media_packets }}
          INPUT_FLEXFEC_REPAIR_PACKETS: ${{ inputs.flexfec_repair_packets }}
          INPUT_MOBILITY: ${{ inputs.mobility }}
          INPUT_PATH: ${{ inputs.path }}
          INPUT_PROTECTION: ${{ inputs.protection }}
          RSTREAM_AUTHENTICATION_TOKEN: ${{ secrets.RSTREAM_QUALIFICATION_TOKEN }}
          RSTREAM_QUALIFICATION_CONFIG_B64: ${{ secrets.RSTREAM_QUALIFICATION_CONFIG_B64 }}
        run: |
          set -euo pipefail
          config_directory="$(mktemp -d)"
          runtime_directory="$(mktemp -d)"
          output_directory="${RUNNER_TEMP}/video-qualification"
          mkdir -p "$output_directory"
          chmod 700 "$config_directory" "$runtime_directory" "$output_directory"
          printf '%s' "$RSTREAM_QUALIFICATION_CONFIG_B64" \
            | base64 --decode >"${config_directory}/config.yaml"
          chmod 600 "${config_directory}/config.yaml"
          if [[ ! -s "${config_directory}/config.yaml" ]]; then
            printf 'Decoded qualification config is empty.\n' >&2
            exit 1
          fi
          mobility=off
          if [[ "$INPUT_MOBILITY" == "true" ]]; then
            mobility=producer
          fi
          if [[ "$INPUT_PATH" != "relay" && "$mobility" != "off" ]]; then
            printf 'Producer mobility requires the relay path.\n' >&2
            exit 1
          fi
          producer_turn_policy=disabled
          if [[ "$INPUT_PATH" == "relay" ]]; then
            producer_turn_policy=relay
          fi
          prepare_arguments=(
            --context qualification
            --output-directory "$runtime_directory"
            --producer-config ../../config.test-pattern.h264.twcc-gcc-flexfec.yaml
            --producer-turn-policy "$producer_turn_policy"
            --turn-transport udp
          )
          if [[ "$INPUT_PROTECTION" == "nack-rtx-flexfec" ]]; then
            prepare_arguments+=(
              --flex-fec
              --flex-fec-media-packets "$INPUT_FLEXFEC_MEDIA_PACKETS"
              --flex-fec-repair-packets "$INPUT_FLEXFEC_REPAIR_PACKETS"
            )
          fi
          RSTREAM_CONFIG="${config_directory}/config.yaml" \
            go run ./cmd/prepare-context "${prepare_arguments[@]}"
          {
            printf 'runtime_directory=%s\n' "$runtime_directory"
            printf 'output_directory=%s\n' "$output_directory"
            printf 'mobility=%s\n' "$mobility"
          } >>"$GITHUB_OUTPUT"

      - name: Run the qualification
        id: qualification
        continue-on-error: true
        working-directory: webrtc-video/producer/qualification/adaptive-streaming
        shell: bash
        env:
          RSTREAM_QUALIFICATION_PATH: ${{ inputs.path }}
          RSTREAM_QUALIFICATION_PROTECTION: ${{ inputs.protection }}
          RSTREAM_QUALIFICATION_PLAYOUT_DELAY_HINT_SECONDS: ${{ inputs.playout_delay_hint_seconds }}
          RSTREAM_QUALIFICATION_FLEXFEC_MEDIA_PACKETS: ${{ inputs.flexfec_media_packets }}
          RSTREAM_QUALIFICATION_FLEXFEC_REPAIR_PACKETS: ${{ inputs.flexfec_repair_packets }}
          RSTREAM_QUALIFICATION_MOBILITY: ${{ steps.runtime.outputs.mobility }}
          RSTREAM_QUALIFICATION_PREPARED_RUNTIME_DIRECTORY: ${{ steps.runtime.outputs.runtime_directory }}
        run: ./run.sh "${{ steps.runtime.outputs.output_directory }}"

      - name: Upload the complete evidence bundle
        if: always() && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-${{ inputs.path }}-${{ inputs.protection }}-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.output_directory }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the qualification verdict
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.qualification.outcome }}" != "success" ]]; then
            printf 'Video qualification failed; inspect the uploaded evidence bundle.\n' >&2
            exit 1
          fi
