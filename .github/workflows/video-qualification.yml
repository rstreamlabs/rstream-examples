name: Video qualification

on:
  workflow_dispatch:
    inputs:
      path:
        description: WebRTC path under test
        required: true
        default: relay
        type: choice
        options:
          - relay
          - direct
      protection:
        description: Packet-repair profile
        required: true
        default: nack-rtx-flexfec
        type: choice
        options:
          - nack-rtx-flexfec
          - nack-rtx
      playout_delay_hint_seconds:
        description: Chromium receiver playout-delay hint
        required: true
        default: "0.2"
        type: string
      flexfec_media_packets:
        description: Media packets per FlexFEC protection group
        required: true
        default: "5"
        type: string
      flexfec_repair_packets:
        description: FlexFEC repair packets per protection group
        required: true
        default: "1"
        type: string
      mobility:
        description: Exercise producer-side network migration
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: video-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: ${{ inputs.path }} ${{ inputs.protection }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: webrtc-video/producer/go.mod
          cache-dependency-path: webrtc-video/producer/go.sum

      - name: Validate qualification inputs
        shell: bash
        env:
          RSTREAM_AUTHENTICATION_TOKEN: ${{ secrets.RSTREAM_QUALIFICATION_TOKEN }}
          RSTREAM_QUALIFICATION_CONFIG_B64: ${{ secrets.RSTREAM_QUALIFICATION_CONFIG_B64 }}
        run: |
          set -euo pipefail
          for name in \
            RSTREAM_AUTHENTICATION_TOKEN \
            RSTREAM_QUALIFICATION_CONFIG_B64; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required qualification setting: %s\n' "$name" >&2
              exit 1
            fi
          done
          docker info >/dev/null

      - name: Prepare runner UDP socket limits
        id: sockets
        shell: bash
        run: |
          set -euo pipefail
          receive_limit="$(sysctl -n net.core.rmem_max)"
          send_limit="$(sysctl -n net.core.wmem_max)"
          {
            printf 'receive_limit=%s\n' "$receive_limit"
            printf 'send_limit=%s\n' "$send_limit"
          } >>"$GITHUB_OUTPUT"
          # Match the qualified local environment without lowering a larger limit.
          sudo sysctl -w \
            "net.core.rmem_max=$((receive_limit > 7500000 ? receive_limit : 7500000))" \
            "net.core.wmem_max=$((send_limit > 7500000 ? send_limit : 7500000))"
          jq -n \
            --argjson previous_receive "$receive_limit" \
            --argjson previous_send "$send_limit" \
            --argjson applied_receive "$(sysctl -n net.core.rmem_max)" \
            --argjson applied_send "$(sysctl -n net.core.wmem_max)" \
            '{previous: {receive: $previous_receive, send: $previous_send},
              applied: {receive: $applied_receive, send: $applied_send}}' \
            >"${RUNNER_TEMP}/video-qualification-socket-limits.json"

      - name: Prepare the credential-isolated runtime
        id: runtime
        working-directory: webrtc-video/producer/qualification/adaptive-streaming
        shell: bash
        env:
          INPUT_FLEXFEC_MEDIA_PACKETS: ${{ inputs.flexfec_media_packets }}
          INPUT_FLEXFEC_REPAIR_PACKETS: ${{ inputs.flexfec_repair_packets }}
          INPUT_MOBILITY: ${{ inputs.mobility }}
          INPUT_PATH: ${{ inputs.path }}
          INPUT_PROTECTION: ${{ inputs.protection }}
          RSTREAM_AUTHENTICATION_TOKEN: ${{ secrets.RSTREAM_QUALIFICATION_TOKEN }}
          RSTREAM_QUALIFICATION_CONFIG_B64: ${{ secrets.RSTREAM_QUALIFICATION_CONFIG_B64 }}
        run: |
          set -euo pipefail
          config_directory="$(mktemp -d)"
          trap 'rm -rf -- "$config_directory"' EXIT
          runtime_directory="$(mktemp -d)"
          # Publish the owned path before preparation so failed setup is cleaned too.
          printf 'runtime_directory=%s\n' "$runtime_directory" >>"$GITHUB_OUTPUT"
          output_directory="${RUNNER_TEMP}/video-qualification"
          mkdir -p "$output_directory"
          chmod 700 "$config_directory" "$runtime_directory" "$output_directory"
          printf '%s' "$RSTREAM_QUALIFICATION_CONFIG_B64" \
            | base64 --decode >"${config_directory}/config.yaml"
          chmod 600 "${config_directory}/config.yaml"
          if [[ ! -s "${config_directory}/config.yaml" ]]; then
            printf 'Decoded qualification config is empty.\n' >&2
            exit 1
          fi
          mobility=off
          if [[ "$INPUT_MOBILITY" == "true" ]]; then
            mobility=producer
          fi
          if [[ "$INPUT_PATH" != "relay" && "$mobility" != "off" ]]; then
            printf 'Producer mobility requires the relay path.\n' >&2
            exit 1
          fi
          producer_turn_policy=disabled
          if [[ "$INPUT_PATH" == "relay" ]]; then
            producer_turn_policy=relay
          fi
          prepare_arguments=(
            --context qualification
            --output-directory "$runtime_directory"
            --producer-config ../../config.test-pattern.h264.twcc-gcc-flexfec.yaml
            --producer-turn-policy "$producer_turn_policy"
            --turn-transport udp
          )
          if [[ "$INPUT_PROTECTION" == "nack-rtx-flexfec" ]]; then
            prepare_arguments+=(
              --flex-fec
              --flex-fec-media-packets "$INPUT_FLEXFEC_MEDIA_PACKETS"
              --flex-fec-repair-packets "$INPUT_FLEXFEC_REPAIR_PACKETS"
            )
          fi
          RSTREAM_CONFIG="${config_directory}/config.yaml" \
            go run ./cmd/prepare-context "${prepare_arguments[@]}"
          {
            printf 'output_directory=%s\n' "$output_directory"
            printf 'mobility=%s\n' "$mobility"
          } >>"$GITHUB_OUTPUT"

      - name: Run the qualification
        id: qualification
        continue-on-error: true
        working-directory: webrtc-video/producer/qualification/adaptive-streaming
        shell: bash
        env:
          RSTREAM_QUALIFICATION_PATH: ${{ inputs.path }}
          RSTREAM_QUALIFICATION_PROTECTION: ${{ inputs.protection }}
          RSTREAM_QUALIFICATION_PLAYOUT_DELAY_HINT_SECONDS: ${{ inputs.playout_delay_hint_seconds }}
          RSTREAM_QUALIFICATION_FLEXFEC_MEDIA_PACKETS: ${{ inputs.flexfec_media_packets }}
          RSTREAM_QUALIFICATION_FLEXFEC_REPAIR_PACKETS: ${{ inputs.flexfec_repair_packets }}
          RSTREAM_QUALIFICATION_MOBILITY: ${{ steps.runtime.outputs.mobility }}
          RSTREAM_QUALIFICATION_PREPARED_RUNTIME_DIRECTORY: ${{ steps.runtime.outputs.runtime_directory }}
        run: ./run.sh "${{ steps.runtime.outputs.output_directory }}"

      - name: Diagnose failed relay setup
        if: inputs.path == 'relay' && steps.runtime.outcome == 'success' && steps.qualification.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: webrtc-video/producer/qualification/adaptive-streaming
        shell: bash
        env:
          RSTREAM_AUTHENTICATION_TOKEN: ${{ secrets.RSTREAM_QUALIFICATION_TOKEN }}
          RSTREAM_CONFIG: ${{ steps.runtime.outputs.runtime_directory }}/config.yaml
          OUTPUT_DIRECTORY: ${{ steps.runtime.outputs.output_directory }}
        run: |
          set -euo pipefail
          diagnostic_directory="$(mktemp -d)"
          trap 'rm -rf -- "$diagnostic_directory"' EXIT
          chmod 700 "$diagnostic_directory"
          GOBIN="$diagnostic_directory" \
            go install github.com/rstreamlabs/rstream-go/cmd/rstream@v1.32.10
          status=0
          timeout --kill-after=5s 45s \
            "${diagnostic_directory}/rstream" --context qualification doctor --output json \
            >"${diagnostic_directory}/report.json" \
            2>"${diagnostic_directory}/stderr.log" || status=$?
          # Only fixed check names, statuses and classifications leave this
          # private directory. Raw URLs, project data and errors are discarded.
          if ! jq -e 'type == "object" and (.checks | type == "array")' \
            "${diagnostic_directory}/report.json" >/dev/null 2>&1; then
            printf '{}\n' >"${diagnostic_directory}/report.json"
          fi
          jq --argjson exit_code "$status" -f doctor-report.jq \
            "${diagnostic_directory}/report.json" \
            >"${OUTPUT_DIRECTORY}/runner-connectivity.json"

      - name: Remove prepared credentials
        if: always()
        shell: bash
        env:
          RUNTIME_DIRECTORY: ${{ steps.runtime.outputs.runtime_directory }}
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_DIRECTORY" ]]; then
            rm -rf -- "$RUNTIME_DIRECTORY"
          fi

      - name: Restore runner UDP socket limits
        if: always() && steps.sockets.outputs.receive_limit != ''
        shell: bash
        env:
          ORIGINAL_RECEIVE_LIMIT: ${{ steps.sockets.outputs.receive_limit }}
          ORIGINAL_SEND_LIMIT: ${{ steps.sockets.outputs.send_limit }}
          OUTPUT_DIRECTORY: ${{ steps.runtime.outputs.output_directory }}
        run: |
          set -euo pipefail
          sudo sysctl -w \
            "net.core.rmem_max=$ORIGINAL_RECEIVE_LIMIT" \
            "net.core.wmem_max=$ORIGINAL_SEND_LIMIT"
          test "$(sysctl -n net.core.rmem_max)" = "$ORIGINAL_RECEIVE_LIMIT"
          test "$(sysctl -n net.core.wmem_max)" = "$ORIGINAL_SEND_LIMIT"
          if [[ -n "$OUTPUT_DIRECTORY" && -d "$OUTPUT_DIRECTORY" && \
            -f "${RUNNER_TEMP}/video-qualification-socket-limits.json" ]]; then
            jq '. + {restored: true}' \
              "${RUNNER_TEMP}/video-qualification-socket-limits.json" \
              >"${OUTPUT_DIRECTORY}/runner-socket-limits.json"
          fi

      - name: Upload the complete evidence bundle
        if: always() && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-${{ inputs.path }}-${{ inputs.protection }}-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.output_directory }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the qualification verdict
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.qualification.outcome }}" != "success" ]]; then
            printf 'Video qualification failed; inspect the uploaded evidence bundle.\n' >&2
            exit 1
          fi
