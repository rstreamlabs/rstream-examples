name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-scripts:
    name: Repository scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            published-tcp-ssh/ssh/entrypoint.sh
            webrtc-video/distributor/scripts/image-smoke.sh
            webrtc-video/producer/build-gstreamer-static-linux.sh
            webrtc-video/producer/build-static-linux.sh
            webrtc-video/producer/qualification/adaptive-streaming/sample-host-cpu.sh
          )
          shellcheck "${scripts[@]}"
          for script in "${scripts[@]}"; do
            sh -n "$script"
          done
          bash_scripts=(
            netcat-media-streaming/qualification/check.sh
            netcat-media-streaming/qualification/common.sh
            netcat-media-streaming/qualification/datagram-media.sh
            netcat-media-streaming/qualification/datagram-media-guaranteed.sh
            netcat-media-streaming/qualification/reliable-media-matrix.sh
            netcat-media-streaming/qualification/rtcp-repair.sh
            netcat-media-streaming/qualification/rtsp-media-matrix.sh
            netcat-media-streaming/qualification/run.sh
            webrtc-video/producer/qualification/adaptive-streaming/run-matrix.sh
            webrtc-video/producer/qualification/adaptive-streaming/run.sh
            webrtc-video/producer/qualification/adaptive-streaming/traffic-control.sh
            webrtc-video/distributor/qualification/end-to-end/run.sh
            webrtc-video/distributor/qualification/end-to-end/configuration-test.sh
            webrtc-video/distributor/qualification/end-to-end/mode.sh
            webrtc-video/distributor/qualification/end-to-end/mode-test.sh
            webrtc-video/distributor/qualification/end-to-end/phase.sh
            webrtc-video/distributor/qualification/end-to-end/phase-test.sh
            webrtc-video/distributor/qualification/end-to-end/resource-report-test.sh
            webrtc-video/distributor/qualification/end-to-end/result-test.sh
            webrtc-video/distributor/qualification/comparison/report-test.sh
            webrtc-video/distributor/qualification/comparison/run.sh
            webrtc-video/distributor/qualification/fanout/report-test.sh
            webrtc-video/distributor/qualification/fanout/run.sh
            webrtc-video/distributor/qualification/matrix/report-test.sh
            webrtc-video/distributor/qualification/matrix/run-test.sh
            webrtc-video/distributor/qualification/matrix/fixtures/comparison-run.sh
            webrtc-video/distributor/qualification/matrix/fixtures/fanout-run.sh
            webrtc-video/distributor/qualification/matrix/fixtures/source-network-run.sh
            webrtc-video/distributor/qualification/matrix/run.sh
            webrtc-video/distributor/qualification/native/report-test.sh
            webrtc-video/distributor/qualification/native/run.sh
            webrtc-video/distributor/qualification/source-network/report-test.sh
            webrtc-video/distributor/qualification/source-network/fixtures/end-to-end-run.sh
            webrtc-video/distributor/qualification/source-network/run-test.sh
            webrtc-video/distributor/qualification/source-network/run.sh
          )
          shellcheck "${bash_scripts[@]}"
          for script in "${bash_scripts[@]}"; do
            bash -n "$script"
          done
          webrtc-video/distributor/qualification/fanout/report-test.sh
          webrtc-video/distributor/qualification/end-to-end/resource-report-test.sh
          webrtc-video/distributor/qualification/end-to-end/result-test.sh
          webrtc-video/distributor/qualification/end-to-end/configuration-test.sh
          webrtc-video/distributor/qualification/end-to-end/mode-test.sh
          webrtc-video/distributor/qualification/end-to-end/phase-test.sh
          webrtc-video/distributor/qualification/comparison/report-test.sh
          webrtc-video/distributor/qualification/matrix/report-test.sh
          webrtc-video/distributor/qualification/matrix/run-test.sh
          webrtc-video/distributor/qualification/native/report-test.sh
          webrtc-video/distributor/qualification/source-network/report-test.sh
          webrtc-video/distributor/qualification/source-network/run-test.sh
          PYTHONPATH=netcat-media-streaming/qualification python3 -m unittest \
            netcat-media-streaming/qualification/test_analyze_frames.py \
            netcat-media-streaming/qualification/test_analyze_logs.py \
            netcat-media-streaming/qualification/test_analyze_rtp.py \
            netcat-media-streaming/qualification/test_compare_frames.py \
            netcat-media-streaming/qualification/test_render_report.py \
            netcat-media-streaming/qualification/test_rtp_probe.py \
            netcat-media-streaming/qualification/test_write_manifest.py
          PYTHONPATH=private-llm-mesh/qualification python3 -m unittest \
            private-llm-mesh/qualification/test_render_report.py
          PYTHONPATH=private-postgres-access/qualification python3 -m unittest \
            private-postgres-access/qualification/test_run.py
      - name: Check Node scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            homelab-rstream/scripts/smoke-local.mjs
            homelab-rstream/scripts/wait-local.mjs
            nextjs-rstream-preview/scripts/smoke-local.mjs
            private-llm-mesh/web/mint-worker-token.mjs
            private-llm-mesh/web/scripts/meshload.mjs
            webrtc-video/platform/scripts/smoke-dev.mjs
            webrtc-video/producer/qualification/adaptive-streaming/collect.mjs
            webrtc-video/producer/qualification/adaptive-streaming/lib/analysis.mjs
          )
          for script in "${scripts[@]}"; do
            node --check "$script"
          done
      - name: Test published TCP SSH image
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          container="rstream-published-tcp-ssh-${GITHUB_RUN_ID}"
          cleanup() {
            docker stop "$container" >/dev/null 2>&1 || true
            docker rm "$container" >/dev/null 2>&1 || true
            find "$tmp" -type f -delete
            rmdir "$tmp"
          }
          trap cleanup EXIT
          ssh-keygen -q -t ed25519 -N "" -f "$tmp/id_ed25519"
          docker build --pull -t rstream-published-tcp-ssh:test published-tcp-ssh/ssh
          if docker run --rm rstream-published-tcp-ssh:test; then
            echo "SSH image accepted a missing authorized key" >&2
            exit 1
          fi
          docker run --name "$container" -d -p 127.0.0.1::22 -v "$tmp/id_ed25519.pub:/run/secrets/authorized_key:ro" rstream-published-tcp-ssh:test
          port="$(docker port "$container" 22/tcp | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$tmp/id_ed25519" -p "$port" demo@127.0.0.1 "test \$(id -u) -gt 0"
  cpp-beast-rstream-tunnel:
    name: C++ Beast rstream tunnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Conan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check conan==2.31.2
          conan profile detect --force
          conan remote add rstream https://nexus.rstream.io/repository/conan
      - name: Verify helpers and native build
        working-directory: cpp-beast-rstream-tunnel
        shell: bash
        run: make verify
  homelab-rstream:
    name: Homelab rstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Test
        working-directory: homelab-rstream
        shell: bash
        run: make test
  nextjs-rstream-preview:
    name: Next.js rstream preview
    runs-on: ubuntu-latest
    env:
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextjs-rstream-preview/package-lock.json
      - name: Install dependencies
        working-directory: nextjs-rstream-preview
        shell: bash
        run: npm ci
      - name: Test
        working-directory: nextjs-rstream-preview
        shell: bash
        run: npm run test
      - name: Build
        working-directory: nextjs-rstream-preview
        shell: bash
        run: npm run build
      - name: Audit production dependencies
        working-directory: nextjs-rstream-preview
        shell: bash
        run: npm audit --omit=dev --audit-level=moderate
  python-fastapi-rstream-tunnel:
    name: Python FastAPI rstream tunnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-fastapi-rstream-tunnel/requirements.txt
      - name: Verify
        working-directory: python-fastapi-rstream-tunnel
        shell: bash
        run: make verify
  python-vision-inference-device:
    name: Python vision inference device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: python-vision-inference/device/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-vision-inference/device/requirements.txt
      - name: Verify
        working-directory: python-vision-inference/device
        shell: bash
        run: make verify
      - name: Check formatting
        working-directory: python-vision-inference/device
        shell: bash
        run: npm run format:check
      - name: Audit production dependencies
        working-directory: python-vision-inference/device
        shell: bash
        run: npm audit --omit=dev --audit-level=moderate
  python-vision-inference-worker:
    name: Python vision inference worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-vision-inference/worker/requirements.txt
      - name: Verify worker and shared protocol
        working-directory: python-vision-inference/worker
        shell: bash
        run: make verify
      - name: Verify qualification tooling
        working-directory: python-vision-inference
        shell: bash
        run: |
          worker/.venv/bin/python -m py_compile qualification/*.py
          PYTHONPATH=.:device:worker:qualification \
            worker/.venv/bin/python -m unittest discover \
              -s qualification -p 'test_*.py'
  private-postgres-access:
    name: Private PostgreSQL access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Test
        working-directory: private-postgres-access
        shell: bash
        run: |
          trap 'make clean' EXIT
          make test
  webrtc-video-platform:
    name: WebRTC video platform
    runs-on: ubuntu-latest
    env:
      POSTGRES_PRISMA_POOL_URL: postgresql://postgres:postgres@localhost:5432/webrtc_video_platform?schema=public
      POSTGRES_PRISMA_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/webrtc_video_platform?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      CRON_SECRET: ci-cron-secret
      DEMO_CLEANUP_ENABLED: "false"
      RSTREAM_CLIENT_ID: ci-rstream-client-id
      RSTREAM_CLIENT_SECRET: ci-rstream-client-secret
      RSTREAM_PROJECT_ENDPOINT: ci-project-endpoint
      DEVICE_TOKEN_TTL_SECONDS: "300"
      VIEWER_TOKEN_TTL_SECONDS: "120"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webrtc-video/platform/package-lock.json
      - name: Install dependencies
        working-directory: webrtc-video/platform
        shell: bash
        run: npm ci
      - name: Install pinned MediaMTX test binary
        shell: bash
        run: |
          set -euo pipefail
          container="rstream-mediamtx-platform-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$container" \
            bluenviron/mediamtx:1.20.0@sha256:86e63af28616d5e5a18540d7b031b6510bd4cbf1a3c7d224f9e2976f02aefbfb
          docker cp "$container:/mediamtx" "${RUNNER_TEMP}/mediamtx"
          chmod 0555 "${RUNNER_TEMP}/mediamtx"
          printf '%s\n' "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Test WHEP client, reconnect policy, and MediaMTX authorization
        working-directory: webrtc-video/platform
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit
          npm run test:mediamtx-auth
      - name: Typecheck
        working-directory: webrtc-video/platform
        shell: bash
        run: npm run check-types
      - name: Check formatting
        working-directory: webrtc-video/platform
        shell: bash
        run: npm run format:check
      - name: Smoke test development server
        working-directory: webrtc-video/platform
        shell: bash
        run: npm run smoke:dev
      - name: Build
        working-directory: webrtc-video/platform
        shell: bash
        run: npm run build
      - name: Audit production dependencies
        working-directory: webrtc-video/platform
        shell: bash
        run: npm audit --omit=dev --audit-level=high
  webrtc-video-distributor:
    name: WebRTC video distributor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: webrtc-video/distributor/go.mod
          cache-dependency-path: webrtc-video/distributor/go.sum
      - name: Install pinned MediaMTX test binary
        shell: bash
        run: |
          set -euo pipefail
          container="rstream-mediamtx-distributor-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$container" \
            bluenviron/mediamtx:1.20.0@sha256:86e63af28616d5e5a18540d7b031b6510bd4cbf1a3c7d224f9e2976f02aefbfb
          docker cp "$container:/mediamtx" "${RUNNER_TEMP}/mediamtx"
          chmod 0555 "${RUNNER_TEMP}/mediamtx"
          printf '%s\n' "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Verify bounded and concurrent behavior
        working-directory: webrtc-video/distributor
        shell: bash
        run: make verify
      - name: Run static analysis
        working-directory: webrtc-video/distributor
        shell: bash
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Scan reachable Go vulnerabilities
        working-directory: webrtc-video/distributor
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Qualify MediaMTX fan-out and source repair
        working-directory: webrtc-video/distributor
        shell: bash
        run: make integration
  webrtc-video-producer:
    name: WebRTC video streaming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: webrtc-video/producer/go.mod
          cache-dependency-path: webrtc-video/producer/go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webrtc-video/producer/package-lock.json
      - name: Install GStreamer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt-get install -y \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            pkg-config
          gst-inspect-1.0 appsink h264parse videotestsrc x264enc >/dev/null
      - name: Test
        working-directory: webrtc-video/producer
        shell: bash
        run: make test
      - name: Race test
        working-directory: webrtc-video/producer
        shell: bash
        run: go test -race ./...
      - name: Run static analysis
        working-directory: webrtc-video/producer
        shell: bash
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Scan reachable Go vulnerabilities
        working-directory: webrtc-video/producer
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Test adaptive-streaming qualification analyzer
        working-directory: webrtc-video/producer/qualification/adaptive-streaming
        shell: bash
        run: |
          npm ci
          npm test
      - name: Check formatting
        working-directory: webrtc-video/producer
        shell: bash
        run: npm run format:check
      - name: Audit production dependencies
        working-directory: webrtc-video/producer
        shell: bash
        run: npm audit --omit=dev --audit-level=high
  private-masque-egress-gateway:
    name: Private MASQUE egress gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: private-masque-egress-gateway/go.mod
          cache-dependency-path: private-masque-egress-gateway/go.sum
      - name: Test
        working-directory: private-masque-egress-gateway
        shell: bash
        run: make test
      - name: Race test
        working-directory: private-masque-egress-gateway
        shell: bash
        run: make test-race
      - name: Build
        working-directory: private-masque-egress-gateway
        shell: bash
        run: make build
  private-llm-mesh-web:
    name: Private LLM mesh web app
    runs-on: ubuntu-latest
    env:
      AUTH_DISABLED: "true"
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      RSTREAM_CLIENT_ID: ci-rstream-client-id
      RSTREAM_CLIENT_SECRET: ci-rstream-client-secret
      RSTREAM_PROJECT_ENDPOINT: ci-project-endpoint
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: private-llm-mesh/web/package-lock.json
      - name: Install dependencies
        working-directory: private-llm-mesh/web
        shell: bash
        run: npm ci
      - name: Verify
        working-directory: private-llm-mesh/web
        shell: bash
        run: npm run verify
  private-llm-mesh-worker:
    name: Private LLM mesh worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: private-llm-mesh/worker/go.mod
          cache-dependency-path: private-llm-mesh/worker/go.sum
      - name: Verify worker
        working-directory: private-llm-mesh/worker
        shell: bash
        run: make verify LLAMA_BUILD_JOBS=2
      - name: Validate composed worker
        working-directory: private-llm-mesh/worker-compose
        shell: bash
        run: docker compose config --quiet
