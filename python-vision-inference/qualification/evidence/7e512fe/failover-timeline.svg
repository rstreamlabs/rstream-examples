<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description" style="font-family:system-ui,sans-serif">
<title id="title">Inference failover timeline</title>
<desc id="description">Worker A is stopped, the open stream reports EOF, and a matching inference result returns through worker B.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="28" y="42" fill="#111827" font-size="32" font-weight="750">Inference failover timeline</text>
<text x="28" y="76" fill="#475569" font-size="18">Abrupt worker loss · same reference frame · surviving worker</text>
<line x1="72" y1="155" x2="912.0" y2="155" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
<line x1="72" y1="155" x2="179.8" y2="155" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
<line x1="179.8" y1="155" x2="912.0" y2="155" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
<circle cx="72" cy="155" r="8" fill="#dc2626"/>
<circle cx="179.8" cy="155" r="8" fill="#d97706"/>
<circle cx="912.0" cy="155" r="8" fill="#059669"/>
<text x="72" y="123" text-anchor="start" fill="#111827" font-family="sans-serif" font-size="17" font-weight="600">worker A stopped</text>
<text x="179.8" y="199" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="17" font-weight="600">EOF 75.3 ms</text>
<text x="912.0" y="123" text-anchor="end" fill="#111827" font-family="sans-serif" font-size="17" font-weight="600">worker B result 586.5 ms</text>
<text x="125.9" y="239" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="16">failure detection</text>
<text x="545.9" y="239" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="16">reconnect, inference, response</text>
</svg>
