# Uses the existing rstream CLI context/project credentials, with no platform enrollment.
# Export a stable VIDEO_DEVICE_ID (lowercase UUID) and VIDEO_DEVICE_NAME (<=80 UTF-8 bytes).
server:
  listen: 127.0.0.1:8080
web:
  viewer:
    enabled: false
  whep:
    allowMediaMTXNativeOffer: false
    requireConfiguredFeatures: true
tunnel:
  enabled: true
  name: video-${VIDEO_DEVICE_ID}
  labels:
    app: webrtc-video-platform
    inventory: discovered
    device: ${VIDEO_DEVICE_ID}
    device-name: "${VIDEO_DEVICE_NAME}"
  auth:
    token: true
    rstream: false
  transport:
    mode: auto
  provisioning:
    mode: local
  reconnect:
    enabled: true
    interval: 5s
turn:
  ttl: 10m
webrtc:
  useTurn: true
  maxViewers: 1
  initialBitrateKbps: 5000
  interceptors:
    twcc: true
    nack: true
    rtx: true
    flexFEC: true
    flexFECMediaPackets: 5
    flexFECRepairPackets: 1
  adaptive:
    enabled: true
    backend: twcc-gcc
    twccGCC:
      minBitrateKbps: 500
      maxBitrateKbps: 10000
      updateInterval: 2s
      changeThresholdPct: 10
      decreaseThresholdPct: 0
      maxIncreaseLossPct: 1
      increaseHoldAfterLoss: 5s
  video:
    mimeType: video/H264
    clockRate: 90000
    payloadType: 96
    rtxPayloadType: 97
    sdpFmtpLine: packetization-mode=1;profile-level-id=42e01f;level-asymmetry-allowed=1
    streamID: rstream-webrtc-video-producer
    trackID: video
media:
  mode: shared
  sinkName: video
  pipeline: >-
    videotestsrc is-live=true pattern=smpte !
    videoconvert !
    video/x-raw,width=1280,height=720,framerate=30/1 !
    x264enc name=encoder tune=zerolatency speed-preset=veryfast bitrate=5000 vbv-buf-capacity=100 option-string=scenecut=0 key-int-max=60 bframes=0 byte-stream=true aud=true !
    h264parse config-interval=-1 !
    video/x-h264,stream-format=byte-stream,alignment=au,profile=constrained-baseline,level=(string)3.1 !
    appsink name=video emit-signals=true sync=false max-buffers=4 drop=true
logging:
  verbose: false
quality:
  default: auto
  presets:
    - id: low
      label: Low
      bitrateKbps: 1000
    - id: medium
      label: Medium
      bitrateKbps: 4000
    - id: high
      label: High
      bitrateKbps: 10000
