<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description" style="font-family:system-ui,sans-serif">
  <title id="title">Packet protection reduces frozen playback</title>
  <desc id="description">Frozen-time share on the impaired rstream relay path with NACK and RTX, then with bounded FlexFEC added.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="78" y="38" font-size="32" font-weight="750" fill="#111827">Packet protection reduces frozen playback</text>
  <text x="78" y="72" font-size="18" fill="#475569">rstream relay · impaired link · lower is better</text>
  <line x1="590" y1="108" x2="590" y2="245" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="582" y="102" text-anchor="end" font-size="16" fill="#b91c1c">10% release ceiling</text>
  <text x="78" y="155" font-size="18" font-weight="650" fill="#111827">NACK + RTX</text>
  <rect x="280" y="130" width="501.5" height="34" rx="5" fill="#d97706"/>
  <text x="791.5" y="155" font-size="18" font-weight="700" fill="#111827">16.2%</text>
  <text x="78" y="225" font-size="18" font-weight="650" fill="#111827">+ bounded FlexFEC</text>
  <rect x="280" y="200" width="110.7" height="34" rx="5" fill="#059669"/>
  <text x="400.7" y="225" font-size="18" font-weight="700" fill="#111827">3.6%</text>
  <line x1="280" y1="255" x2="900" y2="255" stroke="#94a3b8"/>
  <text x="280" y="280" font-size="16" fill="#64748b">0%</text>
  <text x="900" y="280" text-anchor="end" font-size="16" fill="#64748b">20%</text>
</svg>
