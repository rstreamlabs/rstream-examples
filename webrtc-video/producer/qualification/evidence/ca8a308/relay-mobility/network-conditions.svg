<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title description" style="font-family:system-ui,sans-serif">
<title id="title">Controlled network conditions</title><desc id="description">Capacity, one-way delay, jitter, and random packet loss applied by Linux traffic control to the selected media path.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
  <text x="28" y="36" font-size="24" font-weight="650" fill="#111827">Controlled network conditions</text>
<text x="932" y="34" text-anchor="end" font-size="16" font-weight="700" fill="#047857">PASS</text>
<text x="156" y="70" font-size="15" font-weight="600" fill="#111827">Applied capacity · 32 → 16 → 12 → 8.0 → 4.0 → 32 Mb/s</text><text x="156" y="94" font-size="14" fill="#475569">Impaired interval · 120 ms one-way delay · 30 ms jitter · 2.0% random loss</text><rect x="166" y="145" width="63.1" height="436" fill="#f8fafc"/><text x="172" y="127" font-size="14" font-weight="600" fill="#111827">warmup</text><rect x="232.4" y="145" width="79.6" height="436" fill="#eef2f7"/><text x="238.4" y="127" font-size="14" font-weight="600" fill="#111827">baseline</text><rect x="315.2" y="145" width="96.1" height="436" fill="#f8fafc"/><text x="321.2" y="127" font-size="14" font-weight="600" fill="#111827">mobility</text><rect x="414.7" y="145" width="96.2" height="436" fill="#eef2f7"/><text x="420.7" y="127" font-size="14" font-weight="600" fill="#111827">settling</text><rect x="514.2" y="145" width="145.8" height="436" fill="#f8fafc"/><text x="520.2" y="127" font-size="14" font-weight="600" fill="#111827">constrained</text><rect x="663.4" y="145" width="109.4" height="436" fill="#eef2f7"/><text x="669.4" y="127" font-size="14" font-weight="600" fill="#111827">impaired</text><rect x="776.1" y="145" width="146" height="436" fill="#f8fafc"/><text x="782.1" y="127" font-size="14" font-weight="600" fill="#111827">recovery</text><line x1="156" y1="233" x2="932" y2="233" stroke="#cbd5e1"/><text x="144" y="163" text-anchor="end" font-size="14" font-weight="600" fill="#111827">Capacity</text><text x="144" y="183" text-anchor="end" font-size="13" fill="#64748b">Mb/s</text><line x1="156" y1="145" x2="932" y2="145" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="141" text-anchor="end" font-size="12" fill="#64748b">32 Mb/s</text><line x1="156" y1="189" x2="932" y2="189" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="185" text-anchor="end" font-size="12" fill="#64748b">16 Mb/s</text><line x1="156" y1="233" x2="932" y2="233" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="229" text-anchor="end" font-size="12" fill="#64748b">0 Mb/s</text><polyline fill="none" stroke="#be185d" stroke-width="3" points="412.7,145 511.8,145 511.8,189 528.5,189 528.5,200 545,200 545,211 561.5,211 561.5,222 792.5,222 792.5,145 932,145"/><line x1="156" y1="349" x2="932" y2="349" stroke="#cbd5e1"/><text x="144" y="279" text-anchor="end" font-size="14" font-weight="600" fill="#111827">One-way delay</text><text x="144" y="299" text-anchor="end" font-size="13" fill="#64748b">ms</text><line x1="156" y1="261" x2="932" y2="261" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="257" text-anchor="end" font-size="12" fill="#64748b">120 ms</text><line x1="156" y1="305" x2="932" y2="305" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="301" text-anchor="end" font-size="12" fill="#64748b">60 ms</text><line x1="156" y1="349" x2="932" y2="349" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="345" text-anchor="end" font-size="12" fill="#64748b">0 ms</text><polyline fill="none" stroke="#2563eb" stroke-width="3" points="412.7,349 660.3,349 660.3,261 775.9,261 775.9,349 932,349"/><line x1="156" y1="465" x2="932" y2="465" stroke="#cbd5e1"/><text x="144" y="395" text-anchor="end" font-size="14" font-weight="600" fill="#111827">Jitter</text><text x="144" y="415" text-anchor="end" font-size="13" fill="#64748b">ms</text><line x1="156" y1="377" x2="932" y2="377" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="373" text-anchor="end" font-size="12" fill="#64748b">30 ms</text><line x1="156" y1="421" x2="932" y2="421" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="417" text-anchor="end" font-size="12" fill="#64748b">15 ms</text><line x1="156" y1="465" x2="932" y2="465" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="461" text-anchor="end" font-size="12" fill="#64748b">0 ms</text><polyline fill="none" stroke="#d97706" stroke-width="3" points="412.7,465 660.3,465 660.3,377 775.9,377 775.9,465 932,465"/><line x1="156" y1="581" x2="932" y2="581" stroke="#cbd5e1"/><text x="144" y="511" text-anchor="end" font-size="14" font-weight="600" fill="#111827">Injected random loss</text><text x="144" y="531" text-anchor="end" font-size="13" fill="#64748b">%</text><line x1="156" y1="493" x2="932" y2="493" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="489" text-anchor="end" font-size="12" fill="#64748b">2.0 %</text><line x1="156" y1="537" x2="932" y2="537" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="533" text-anchor="end" font-size="12" fill="#64748b">1.0 %</text><line x1="156" y1="581" x2="932" y2="581" stroke="#e2e8f0" stroke-width="1"/><text x="927" y="577" text-anchor="end" font-size="12" fill="#64748b">0 %</text><polyline fill="none" stroke="#dc2626" stroke-width="3" points="412.7,581 660.3,581 660.3,493 775.9,493 775.9,581 932,581"/>
