# Automatic source-format qualification profile. The public provisioning
# example keeps automatic adaptation disabled until its pipeline is qualified.
server:
  listen: 127.0.0.1:8080
web:
  viewer:
    enabled: false
  whep:
    allowMediaMTXNativeOffer: false
    requireConfiguredFeatures: true
tunnel:
  enabled: true
  name: webrtc-video-producer-adaptive
  auth:
    token: true
    rstream: false
  transport:
    mode: auto
  provisioning:
    mode: local
  reconnect:
    enabled: true
    interval: 5s
turn:
  ttl: 10m
webrtc:
  useTurn: false
  maxViewers: 1
  initialBitrateKbps: 3000
  interceptors:
    twcc: true
    nack: true
    rtx: true
    flexFEC: true
    flexFECMediaPackets: 5
    flexFECRepairPackets: 1
  adaptive:
    enabled: true
    backend: twcc-gcc
    twccGCC:
      minBitrateKbps: 500
      maxBitrateKbps: 6000
      updateInterval: 2s
      changeThresholdPct: 10
      decreaseThresholdPct: 0
      maxIncreaseLossPct: 1
      increaseHoldAfterLoss: 5s
  video:
    mimeType: video/H264
    clockRate: 90000
    payloadType: 96
    rtxPayloadType: 97
    sdpFmtpLine: packetization-mode=1;profile-level-id=42e01f;level-asymmetry-allowed=1
    streamID: rstream-webrtc-video-producer
    trackID: video
media:
  mode: shared
  sinkName: video
  pipeline: >-
    videotestsrc is-live=true pattern=smpte !
    videoconvert !
    capsfilter name=source_format caps=video/x-raw,format=I420,width=1280,height=720,framerate=30/1 !
    x264enc name=encoder tune=zerolatency speed-preset=veryfast bitrate=3000 vbv-buf-capacity=100 option-string=scenecut=0 key-int-max=30 bframes=0 byte-stream=true aud=true !
    h264parse config-interval=-1 !
    video/x-h264,stream-format=byte-stream,alignment=au,profile=constrained-baseline,level=(string)3.1 !
    appsink name=video emit-signals=true sync=false max-buffers=4 drop=true
  format:
    capsFilter: source_format
    default: large
    transitionTimeout: 3s
    profiles:
      - id: small
        width: 640
        height: 360
        frameRate: { numerator: 15, denominator: 1 }
        minBitrateKbps: 500
      - id: medium
        width: 960
        height: 540
        frameRate: { numerator: 24, denominator: 1 }
        minBitrateKbps: 1500
      - id: large
        width: 1280
        height: 720
        frameRate: { numerator: 30, denominator: 1 }
        minBitrateKbps: 3000
    adaptive:
      enabled: true
      downHold: 3s
      upHold: 15s
      minDwell: 10s
      upHeadroomPct: 30
logging:
  verbose: false
quality:
  default: auto
  presets:
    - id: low
      label: Low
      bitrateKbps: 1000
      sourceProfile: small
    - id: medium
      label: Medium
      bitrateKbps: 3000
      sourceProfile: medium
    - id: high
      label: High
      bitrateKbps: 6000
      sourceProfile: large
