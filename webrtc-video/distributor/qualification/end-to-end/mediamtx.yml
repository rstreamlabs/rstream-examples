logLevel: info
logDestinations: [stdout]

api: false
metrics: true
metricsAddress: :9998
pprof: false
playback: false

rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []

pathDefaults:
  source: publisher
  maxReaders: 8
  runOnDemand: /usr/local/bin/rstream-video-distributor
  runOnDemandRestart: false
  runOnDemandStartTimeout: 15s
  runOnDemandCloseAfter: 1s

paths:
  all_others:
