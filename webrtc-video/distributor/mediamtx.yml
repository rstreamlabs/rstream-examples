logLevel: info
logDestinations: [stdout]

authMethod: jwt
authJWTJWKS: https://platform.invalid/api/video/distributor/jwks
authJWTClaimKey: mediamtx_permissions
authJWTExclude:
  - action: metrics
authJWTIssuer: replace-with-the-platform-issuer
authJWTAudience: replace-with-the-platform-audience

api: false
metrics: true
metricsAddress: :9998
pprof: false
playback: false
playbackAddress: :9996
playbackAllowOrigins: []

rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: [https://platform.invalid]
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []
webrtcSTUNGatherTimeout: 5s
webrtcHandshakeTimeout: 10s
# The distributor publishes one known video track, so MediaMTX does not need
# its multi-track discovery window after receiving the first RTP packet.
webrtcTrackGatherTimeout: 250ms

pathDefaults:
  # Optional recent history. Supply a bounded writable /recordings volume and
  # explicitly enable record + playback; recording never starts this source.
  record: false
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordMaxPartSize: 8M
  recordSegmentDuration: 5s
  recordDeleteAfter: 5m
  source: publisher
  overridePublisher: false
  maxReaders: 8
  runOnDemand: /usr/local/bin/rstream-video-distributor
  runOnDemandRestart: false
  runOnDemandStartTimeout: 15s
  runOnDemandCloseAfter: 5s
  # Request a fresh source key frame after each reader's transport connects.
  runOnRead: /usr/local/bin/rstream-video-distributor reader-started
  runOnReadRestart: false

paths:
  all_others:
